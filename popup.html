<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Medium Trending Topics Finder</title>
    <style>
      :root {
        --clay-bg: #f6efe6;
        --clay-card: #fbf7f1;
        --clay-ink: #1e293b;
        --clay-muted: #5c6b73;
        --clay-shadow: 0 12px 24px -10px rgba(56, 74, 70, 0.18), inset 2px 2px 5px rgba(255, 255, 255, 0.9), inset -2px -2px 6px rgba(145, 160, 155, 0.14);
        --clay-sans: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
      }

      * { box-sizing: border-box; }

      body {
        width: 380px;
        margin: 0;
        padding: 16px;
        font-family: var(--clay-sans);
        background: linear-gradient(145deg, #f8f2ea 0%, #eef5f1 100%);
        color: var(--clay-ink);
        -webkit-font-smoothing: antialiased;
      }

      .top-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 14px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .orb-icon {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        background: linear-gradient(135deg, #b8dde4, #88bec9);
        box-shadow: var(--clay-shadow);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .orb-icon::after {
        content: '';
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: linear-gradient(135deg, #dff1ea, #a7d5c5);
        box-shadow: inset 1px 1px 3px rgba(255, 255, 255, 0.9);
      }

      .brand h1 { margin: 0; font-size: 14.5px; font-weight: 800; }
      .brand p { margin: 1px 0 0; font-size: 11px; color: var(--clay-muted); }

      .pill {
        font-size: 10.5px;
        font-weight: 700;
        color: #266c5d;
        background: #cde8d9;
        padding: 5px 10px;
        border-radius: 999px;
        box-shadow: var(--clay-shadow);
      }

      .topic-form {
        display: flex;
        gap: 8px;
        margin-bottom: 14px;
      }

      .topic-input {
        flex: 1;
        border: 1px solid rgba(255, 255, 255, 0.85);
        background: var(--clay-card);
        border-radius: 999px;
        padding: 10px 14px;
        font-size: 12.5px;
        color: var(--clay-ink);
        font-family: inherit;
        outline: none;
        box-shadow: inset 2px 2px 5px rgba(145, 160, 155, 0.18), inset -2px -2px 5px rgba(255, 255, 255, 0.9);
      }

      .btn-primary {
        background: linear-gradient(135deg, #3c9d88 0%, #266c5d 100%);
        color: #ffffff;
        border: none;
        border-radius: 999px;
        padding: 10px 16px;
        font-size: 12.5px;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 8px 16px -6px rgba(38, 108, 93, 0.45), inset 1px 1px 3px rgba(255, 255, 255, 0.35);
      }

      .section-label {
        font-size: 11px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--clay-muted);
        margin: 0 0 8px;
      }

      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
        margin-bottom: 14px;
      }

      .chip {
        background: var(--clay-card);
        border: 1px solid rgba(255, 255, 255, 0.85);
        border-radius: 999px;
        padding: 6px 11px;
        font-size: 11.5px;
        font-weight: 700;
        color: var(--clay-ink);
        cursor: pointer;
        box-shadow: var(--clay-shadow);
      }

      .trending-list {
        display: flex;
        flex-direction: column;
        gap: 9px;
        max-height: 230px;
        overflow-y: auto;
        margin-bottom: 12px;
      }

      .story-item {
        background: var(--clay-card);
        border: 1px solid rgba(255, 255, 255, 0.85);
        border-radius: 16px;
        padding: 11px 13px;
        text-decoration: none;
        color: inherit;
        display: block;
        box-shadow: var(--clay-shadow);
      }

      .story-title { font-size: 12.5px; font-weight: 700; margin: 0 0 5px; line-height: 1.35; }
      .story-meta { font-size: 11px; color: var(--clay-muted); font-weight: 600; }

      .empty-state {
        background: var(--clay-card);
        border-radius: 16px;
        padding: 14px;
        text-align: center;
        font-size: 12px;
        color: var(--clay-muted);
        box-shadow: var(--clay-shadow);
      }

      /* Soft 3D Skeleton Loading for Popup */
      .skeleton-story {
        background: var(--clay-card);
        border: 1px solid rgba(255, 255, 255, 0.85);
        border-radius: 16px;
        padding: 12px 14px;
        box-shadow: var(--clay-shadow);
      }

      .skeleton-bar {
        border-radius: 999px;
        background: linear-gradient(90deg, #ede6dc 0%, rgba(169, 209, 218, 0.38) 50%, #ede6dc 100%);
        background-size: 200% 100%;
        animation: mtr-clay-shimmer 1.5s ease-in-out infinite;
        box-shadow: inset 1px 1px 2px rgba(255, 255, 255, 0.8);
      }

      .skeleton-title {
        height: 13px;
        width: 80%;
        margin-bottom: 7px;
      }

      .skeleton-meta {
        height: 10px;
        width: 52%;
      }

      @keyframes mtr-clay-shimmer {
        0% { background-position: 200% 0; }
        100% { background-position: -200% 0; }
      }

      .footer {
        padding-top: 10px;
        border-top: 1px solid rgba(15, 23, 42, 0.06);
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        color: var(--clay-muted);
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="top-bar">
      <div class="brand">
        <div class="orb-icon"></div>
        <div>
          <h1>Medium Trending Topics Finder</h1>
          <p>Claps, comments &amp; velocity</p>
        </div>
      </div>
      <span class="pill">100% Local</span>
    </div>

    <form class="topic-form" id="topic-form">
      <input class="topic-input" id="topic-input" type="text" placeholder="Jump to topic (e.g. python, ai)" />
      <button class="btn-primary" type="submit">Scan ↗</button>
    </form>

    <p class="section-label">Trending Topics</p>
    <div class="chips">
      <button type="button" class="chip" data-tag="technology">technology</button>
      <button type="button" class="chip" data-tag="artificial-intelligence">artificial-intelligence</button>
      <button type="button" class="chip" data-tag="programming">programming</button>
      <button type="button" class="chip" data-tag="python">python</button>
      <button type="button" class="chip" data-tag="writing">writing</button>
    </div>

    <p class="section-label">Latest Scanned Winners</p>
    <div class="trending-list" id="trending-list">
      <div class="empty-state">
        Open any Medium topic page to rank stories by claps, comments, and engagement score.
      </div>
    </div>

    <div class="footer">
      <span>🔒 Zero tracking</span>
      <span id="cache-tag">Ready</span>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
